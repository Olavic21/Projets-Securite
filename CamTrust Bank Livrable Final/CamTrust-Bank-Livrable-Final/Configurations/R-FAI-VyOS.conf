# CONFIGURATION DE RÉFÉRENCE – NON APPLIQUÉE TELLE QUELLE – voir rapport, section 2
# ============================================================
# R-FAI : configuration de référence (VyOS 1.4, style set)
# STATUT : NON VÉRIFIÉE. Rédigée, jamais appliquée.
# Historique : la route statique 10.10.99.0/24 via 198.51.100.2
# était présente dans la config mais ABSENTE de la table de routage.
# Cette configuration est une CORRECTION à valider, pas une route
# qui fonctionnait.
# Hypothèses : eth0 = liaison R-SIEGE (198.51.100.1/30)
#              eth1 = Internet simulé (203.0.113.1/24)
#              SRV-INTERNET = 203.0.113.10
# ============================================================

# --- 1. Identité, horloge (M1-05) -------------------------------
set system host-name 'R-FAI'
set system domain-name 'camtrust.local'
set system time-zone 'Africa/Douala'

# --- 2. Interfaces (M1-01, M1-06) -------------------------------
set interfaces ethernet eth0 description 'Liaison R-SIEGE'
set interfaces ethernet eth0 address '198.51.100.1/30'
set interfaces ethernet eth0 ip source-validation 'strict'
set interfaces ethernet eth1 description 'Internet simule'
set interfaces ethernet eth1 address '203.0.113.1/24'

# --- 3. Route de retour vers l'admin (correction) ---------------
# Conditions : eth0 UP, 198.51.100.2 joignable (show arp).
set protocols static route 10.10.99.0/24 next-hop 198.51.100.2

# --- 4. Comptes (M1-02) -----------------------------------------
set system login user adminfai full-name 'Administrateur R-FAI'
set system login user adminfai authentication encrypted-password '<masqué>'
set system login user adminfai level admin
# Après test de adminfai : delete system login user vyos

# --- 5. SSH (M1-01) ---------------------------------------------
set service ssh port '22'
set service ssh listen-address '198.51.100.1'
set service ssh disable-password-authentication

# --- 6. RADIUS (M1-03) : syntaxe à VÉRIFIER dans votre version --
# set system login radius-server 10.10.99.20 key '<masqué>'
# set system login radius-server 10.10.99.20 port '1812'
# set system login radius-server 10.10.99.20 timeout '3'
# Le secours local reste indispensable.

# --- 7. Syslog et NTP (M1-04, M1-05) ----------------------------
set system syslog host 10.10.99.20 facility all level 'info'
set system ntp server 10.10.99.20

# --- 8. Filtrage entrant (M1-06, M1-07) -------------------------
set firewall ipv4 input filter default-action 'drop'
set firewall ipv4 input filter rule 10 action 'accept'
set firewall ipv4 input filter rule 10 state established 'enable'
set firewall ipv4 input filter rule 10 state related 'enable'
set firewall ipv4 input filter rule 20 action 'drop'
set firewall ipv4 input filter rule 20 state invalid 'enable'
set firewall ipv4 input filter rule 30 action 'accept'
set firewall ipv4 input filter rule 30 protocol 'icmp'
set firewall ipv4 input filter rule 30 source address '10.10.99.0/24'
set firewall ipv4 input filter rule 40 action 'accept'
set firewall ipv4 input filter rule 40 protocol 'tcp'
set firewall ipv4 input filter rule 40 destination port '22'
set firewall ipv4 input filter rule 40 source address '10.10.99.0/24'

# --- 9. Filtrage transit (M1-06) --------------------------------
set firewall ipv4 forward filter default-action 'drop'
set firewall ipv4 forward filter rule 10 action 'accept'
set firewall ipv4 forward filter rule 10 state established 'enable'
set firewall ipv4 forward filter rule 10 state related 'enable'
# Flux transit à définir selon la politique

# --- Validation -------------------------------------------------
# commit ; save
